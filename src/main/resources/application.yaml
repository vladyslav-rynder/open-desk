spring:
  application:
    name: open-desk

  datasource:
    url: jdbc:postgresql://localhost:5432/opendesk_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080